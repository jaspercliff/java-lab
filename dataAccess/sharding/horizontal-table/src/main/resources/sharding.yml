mode:
  type: Standalone
  repository:
    type: Memory

dataSources:
  m1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/sharding-order-1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
  m2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/sharding-order-2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
  m3: # 垂直分库
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/sharding-user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
  master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3309/rw_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
  slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3310/rw_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
rules:
  - !SHARDING
    tables:
      t_user:
        actualDataNodes: m3.t_user
      sys_user:
        actualDataNodes: rw_ds.sys_user
      t_order:
        actualDataNodes: m$->{1..2}.t_order_$->{1..2}

        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: database-inline

        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: table-inline

        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

    shardingAlgorithms:

      database-inline:
        type: INLINE
        props:
          algorithm-expression: m$->{(user_id % 2) + 1}

      table-inline:
        type: INLINE
        props:
          algorithm-expression: t_order_$->{(id % 2) + 1}

    keyGenerators:
      snowflake:
        type: SNOWFLAKE
  - !BROADCAST
    tables:
      - t_dict # 广播表 所有数据库都有的
  - !READWRITE_SPLITTING
    dataSourceGroups:
      rw_ds:
        writeDataSourceName: master
        readDataSourceNames:
          - slave
        loadBalancerName: round_robin
        transactionalReadQueryStrategy: PRIMARY # 在一个事务中，所有读请求都强制走主库（PRIMARY）
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

props:
  sql-show: true