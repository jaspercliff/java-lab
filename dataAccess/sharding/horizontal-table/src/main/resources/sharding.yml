mode:
  type: Standalone
  repository:
    type: Memory

dataSources:
  m1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/sharding-order-1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd
  m2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3307/sharding-order-2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: passwd

rules:
  - !SHARDING
    tables:
      t_order:
        actualDataNodes: m$->{1..2}.t_order_$->{1..2}

        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: database-inline

        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: table-inline

        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

    shardingAlgorithms:

      database-inline:
        type: INLINE
        props:
          algorithm-expression: m$->{(user_id % 2) + 1}

      table-inline:
        type: INLINE
        props:
          algorithm-expression: t_order_$->{(id % 2) + 1}

    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: true