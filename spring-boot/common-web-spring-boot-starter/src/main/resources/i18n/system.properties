# 系统错误码文案（SYS + 数字码），与业务码 RB 前缀分开
# 校验异常统一 key，便于前端按类型处理
SYS200=操作成功
SYS400=请求参数错误
SYS403=没有相关权限
SYS404=请求资源不存在
SYS405=请求方法不允许
SYS412=参数校验失败
SYS413=上传文件过大
SYS415=不支持的媒体类型
SYS500=服务器内部错误
SYS502=下游服务调用失败
SYS503=服务不可用
VALIDATION_BODY=请求参数校验失败
VALIDATION_PARAM=方法参数校验失败
VALIDATION_METHOD=方法入参校验失败
BAD_REQUEST_JSON=请求体格式错误
