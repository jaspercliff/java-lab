services:
  redis-single:
    image: redis:8
    labels:
      org.springframework.boot.ignore: true
    container_name: infra-redis-single
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../container/redis8/single/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ../container/redis8/single/data:/data
    ports:
      - "6379:6379"
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge

