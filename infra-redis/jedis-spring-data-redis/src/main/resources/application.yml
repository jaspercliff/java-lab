spring:
  config:
    import: classpath:compose-support.yml
  data:
    redis:
      host: localhost
      port: 6379
      password: passwd
      client-type: jedis
      jedis:
        pool:
          enabled: true
          # 最大连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数
          min-idle: 0
          # 获取连接最大等待时间
          max-wait: 3s

