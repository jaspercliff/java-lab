services:
  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: nacos
    restart: unless-stopped

    env_file:
      - ./env/nacos.env

    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

    volumes:
      - ./logs:/home/nacos/logs
    networks:
      - java-lab
networks:
  java-lab:
    external: true