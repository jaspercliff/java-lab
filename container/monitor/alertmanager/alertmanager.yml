global:
  resolve_timeout: 5m

route:
  receiver: spring-boot-webhook

  # 按告警名称、应用名称分组
  group_by:
    - alertname
    - app

  # 新告警等待 10 秒再发送
  group_wait: 10s

  # 同组新告警间隔
  group_interval: 5m

  # 未恢复告警重复通知间隔
  repeat_interval: 4h

receivers:
  - name: spring-boot-webhook
    webhook_configs:
      - url: http://192.168.31.189:18082/webhook/alert
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          authorization:
            type: Bearer
            credentials: dev-secret-change-me