# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]

slf4j = "2.0.17"
logback = "1.5.32"

lombok = "1.18.42"
caffeine = "3.2.3"
guava = "33.5.0-jre"
ttl = "2.14.5"


spring-boot = "3.5.16"

mysql-connector = "26.7.0"
mybatis-plus = "3.5.17"
sharding-jdbc = "5.5.3"


jedis = "8.0.0"
lettuce = "7.7.0.RELEASE"
redisson-starter = "3.52.0"

junit = "5.14.4"
testcontainers = "2.0.5"

[libraries]

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
# logback 已经引入slf4j-api  依赖传递  这里写 为了更换logback时不会报错
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

ttl = {module= "com.alibaba:transmittable-thread-local",version.ref = "ttl"}

# 三方库
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }


mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatis-plus" }

sharding-jdbc = { module = "org.apache.shardingsphere:shardingsphere-jdbc", version.ref = "sharding-jdbc" }
# 5.5.x 起为可选插件，需显式引入
sharding-infra-url-classpath = { module = "org.apache.shardingsphere:shardingsphere-infra-url-classpath", version.ref = "sharding-jdbc" }
sharding-core = { module = "org.apache.shardingsphere:shardingsphere-sharding-core", version.ref = "sharding-jdbc" }
sharding-hikari = { module = "org.apache.shardingsphere:shardingsphere-infra-data-source-pool-hikari", version.ref = "sharding-jdbc" }
sharding-mysql-dialect = { module = "org.apache.shardingsphere:shardingsphere-jdbc-dialect-mysql", version.ref = "sharding-jdbc" }
sharding-standalone-mode = { module = "org.apache.shardingsphere:shardingsphere-standalone-mode-core", version.ref = "sharding-jdbc" }
sharding-standalone-repo-memory = { module = "org.apache.shardingsphere:shardingsphere-standalone-mode-repository-memory", version.ref = "sharding-jdbc" }
sharding-authority-simple = { module = "org.apache.shardingsphere:shardingsphere-authority-simple", version.ref = "sharding-jdbc" }


spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
###################################### spring starter
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

###################################### third starter

redisson-spring-boot-starter = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson-starter" }

################################# test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
# 启动和发现测试
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-testcontainers = { module = "org.testcontainers:testcontainers" }

[plugins]
#spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

[bundles]
testcontainers = [
  "testcontainers-junit-jupiter",
  "testcontainers-testcontainers",
]
