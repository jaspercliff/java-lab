[versions]
slf4j = "2.0.17"
logback = "1.5.32"
lombok = "1.18.42"
caffeine = "3.2.3"
guava = "33.5.0-jre"
ttl = "2.14.5"
mapstruct = "1.6.3"
mapstruct-lombok = "0.2.0"
jackson = "3.2.2"
cglib = "3.3.0"

aspectj = "1.9.24"
mybatis = "3.5.19"
mysql-connector = "26.7.0"
mybatis-plus = "3.5.17"
sharding-jdbc = "5.5.3"
postgresql = "42.7.14"
flyway = "13.12.1"

jedis = "8.0.0"
lettuce = "7.7.0.RELEASE"
redisson-starter = "3.52.0"
junit = "5.14.4"
testcontainers = "2.0.5"
jakarta-annotation = "3.0.0"
jakarta-servlet = "6.1.0"
resilience4j = "2.4.0"
spring-boot-admin= "3.5.11"
prometheus = "1.17.1"
# springdoc 2.x -> Spring Boot 3.x；3.x 才对应 Spring Boot 4
springdoc = "2.10.0"

spring = "6.2.19"
spring-boot = "3.5.16"
springCloud = "2025.0.0"
springCloudAlibaba = "2025.0.0.0"
# RocketMQ Remoting 客户端（4.x 兼容 API，含 ACL / trace / tools）与 5.x gRPC SDK
rocketmq = "5.5.1"
rocketmq-v5-sdk = "5.2.2"
openfeign-jackson = "13.15"
assertj = "3.27.7"
mockito = "5.24.0"

[libraries]

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
# logback 已经引入slf4j-api  依赖传递  这里写 为了更换logback时不会报错
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
#mapstruct 读取 lombok生成的getter setter 等
mapstruct-lombok-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "mapstruct-lombok" }
jackson = {module = "tools.jackson.core:jackson-databind",version.ref = "jackson"}
ttl = {module= "com.alibaba:transmittable-thread-local",version.ref = "ttl"}
cglib = {module = "cglib:cglib",version.ref = "cglib"}
jakarta-annotation = {module = "jakarta.annotation:jakarta.annotation-api",version.ref="jakarta-annotation"}
jakarta-servlet = {module = "jakarta.servlet:jakarta.servlet-api",version.ref="jakarta-servlet"}
resilience4j-all = {module = "io.github.resilience4j:resilience4j-all",version.ref="resilience4j"}
resilience4j-consumer = {module="io.github.resilience4j:resilience4j-consumer",version.ref="resilience4j"}

# 三方库
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }


mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mybaits = { module = "org.mybatis:mybatis", version.ref = "mybatis" }
mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatis-plus" }
# 3.5.9+ 分页/租户/动态表名等 SQL 解析插件不在 starter 传递依赖里，需单独引入
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "mybatis-plus" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway = {module = "org.flywaydb:flyway-core",version.ref = "flyway"}
flyway-pg = {module = "org.flywaydb:flyway-database-postgresql",version.ref ="flyway"}
flyway-mysql = {module ="org.flywaydb:flyway-mysql",version.ref ="flyway"}

sharding-jdbc = { module = "org.apache.shardingsphere:shardingsphere-jdbc", version.ref = "sharding-jdbc" }
# 5.5.x 起为可选插件，需显式引入
sharding-infra-url-classpath = { module = "org.apache.shardingsphere:shardingsphere-infra-url-classpath", version.ref = "sharding-jdbc" }
sharding-core = { module = "org.apache.shardingsphere:shardingsphere-sharding-core", version.ref = "sharding-jdbc" }
sharding-hikari = { module = "org.apache.shardingsphere:shardingsphere-infra-data-source-pool-hikari", version.ref = "sharding-jdbc" }
sharding-mysql-dialect = { module = "org.apache.shardingsphere:shardingsphere-jdbc-dialect-mysql", version.ref = "sharding-jdbc" }
sharding-standalone-mode = { module = "org.apache.shardingsphere:shardingsphere-standalone-mode-core", version.ref = "sharding-jdbc" }
sharding-standalone-repo-memory = { module = "org.apache.shardingsphere:shardingsphere-standalone-mode-repository-memory", version.ref = "sharding-jdbc" }
sharding-authority-simple = { module = "org.apache.shardingsphere:shardingsphere-authority-simple", version.ref = "sharding-jdbc" }
sharding-broadcase-core = {module = "org.apache.shardingsphere:shardingsphere-broadcast-core", version.ref = "sharding-jdbc" }
shardingsphere-readwrite-splitting-core = {module = "org.apache.shardingsphere:shardingsphere-readwrite-splitting-core",version.ref="sharding-jdbc"}




spring-framework-bom = {module = "org.springframework:spring-framework-bom",version.ref = "spring"}
spring-context = { module = "org.springframework:spring-context" }
spring-aop = { module = "org.springframework:spring-aop" }
spring-tx = { module = "org.springframework:spring-tx" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }
spring-web = { module = "org.springframework:spring-web" }


spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = {module = "org.springframework.boot:spring-boot-autoconfigure"}
spring-boot = { module = "org.springframework.boot:spring-boot" }


bom-springcloud = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
bom-alibaba = { module = "com.alibaba.cloud:spring-cloud-alibaba-dependencies", version.ref = "springCloudAlibaba" }
# RocketMQ：老 SDK（Remoting 协议，DefaultMQProducer/PushConsumer/Admin）与 5.x 新 SDK（gRPC，SimpleConsumer/PushConsumer）
rocketmq-client = { module = "org.apache.rocketmq:rocketmq-client", version.ref = "rocketmq" }
rocketmq-tools = { module = "org.apache.rocketmq:rocketmq-tools", version.ref = "rocketmq" }
rocketmq-client-java = { module = "org.apache.rocketmq:rocketmq-client-java", version.ref = "rocketmq-v5-sdk" }
spring-boot-configuration-processor = {module="org.springframework.boot:spring-boot-configuration-processor"}
micrometer-registry-prometheus = {module = "io.micrometer:micrometer-registry-prometheus",version.ref = "prometheus"}


spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
###################################### spring starter
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = {group = "org.springframework.boot",name = "spring-boot-starter-actuator"}
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-aop = {module = "org.springframework.boot:spring-boot-starter-aop"}
spring-boot-starter-cache = {module = "org.springframework.boot:spring-boot-starter-cache"}
spring-boot-starter-integration = {module = "org.springframework.boot:spring-boot-starter-integration"}

spring-boot-starter-quartz = {module = "org.springframework.boot:spring-boot-starter-quartz"}
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

###################################### third starter

# springdoc 官方整合 starter：传递引入 springdoc-openapi-starter-webmvc-api（生成 /v3/api-docs）
# + springdoc-openapi-starter-webmvc-ui（渲染 /swagger-ui.html），不需要再单独声明这两个依赖
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# 只要 JSON/YAML、不要任何 UI 时用这个（与上面的 ui starter 二选一）
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

redisson-spring-boot-starter = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson-starter" }
resilience4j-spring-boot3 = {module ="io.github.resilience4j:resilience4j-spring-boot3",version.ref = "resilience4j"}
spring-boot-admin-starter-server = {module = "de.codecentric:spring-boot-admin-starter-server",version.ref = "spring-boot-admin"}
spring-boot-admin-starter-client = {module = "de.codecentric:spring-boot-admin-starter-client",version.ref = "spring-boot-admin"}

###################################### cloud
openfeign = { group = "org.springframework.cloud", name = "spring-cloud-starter-openfeign"}
openfeign-jackson = {module = "io.github.openfeign:feign-jackson",version.ref="openfeign-jackson"}
nacos-discovery = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-discovery" }
nacos-config = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-config" }
seata = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-seata" }
loadbalancer = { group = "org.springframework.cloud", name = "spring-cloud-starter-loadbalancer" }
cloud-resilience4j = {module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j"}

################################# test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
# 启动和发现测试
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = {module = "org.assertj:assertj-core",version.ref="assertj"}
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-testcontainers = { module = "org.testcontainers:testcontainers" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
#spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

[bundles]
testcontainers = [
  "testcontainers-junit-jupiter",
  "testcontainers-testcontainers",
]
